
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
server:
  port: 8082
